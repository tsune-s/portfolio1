[project]
name = "portfolio"
version = "0.1.0"
description = "Data Analysis Portfolio - Comprehensive showcase of data engineering and analytics capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.12.0",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    # Data Processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "polars>=0.20.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    # Machine Learning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    # Dashboard
    "streamlit>=1.30.0",
    # Data Collection
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    # Jupyter
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
]
